{% extends "base.html" %}

{% block content %}
<h2>Draft Email — {{ job.title }} @ {{ job.company }}</h2>
<p><a href="/jobs">← Back to jobs</a></p>

<p style="background: #fff3cd; color: #856404; padding: 0.5rem; border-radius: 4px; font-size: 0.9rem;">
    This is a draft only. Review and edit before sending — nothing is sent automatically.
</p>

<label style="display: block; margin-top: 1rem;"><strong>Subject</strong></label>
<input type="text" value="{{ draft.subject }}" style="width: 100%; padding: 0.4rem;" onclick="this.select()">

<label style="display: block; margin-top: 1rem;"><strong>Body</strong></label>
<textarea rows="16" style="width: 100%; padding: 0.4rem;" onclick="this.select()">{{ draft.body }}</textarea>
{% endblock %}
